[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-usage-notifier"
version = "0.1.0"
description = "macOS notifier when Cursor monthly usage crosses configurable USD thresholds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cursor-usage-notifier = "cursor_usage_notifier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
