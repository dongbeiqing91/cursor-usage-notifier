# Cursor Usage Notifier configuration
# Copy to ~/Library/Application Support/cursor-usage-notifier/config.toml

threshold_usd = 50
poll_minutes = 5
sound = "Glass"

# Local usage history dashboard
web_host = "127.0.0.1"
web_port = 8765

